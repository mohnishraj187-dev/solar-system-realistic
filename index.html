<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar System — Realistic Data Lab</title>
  <style>
    :root { color-scheme: dark; --panel: rgba(10,15,28,.86); --line: #263552; --text: #e7edf8; --muted:#91a0bb; }
    * { box-sizing:border-box } body { margin:0; overflow:hidden; background:#02040b; color:var(--text); font:14px system-ui, sans-serif }
    #app { position:fixed; inset:0 } canvas { display:block }
    .panel { position:fixed; z-index:2; background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(12px); box-shadow:0 12px 40px #0008 }
    #title { top:16px; left:16px; padding:13px 16px; font-size:18px; font-weight:700; letter-spacing:.2px }
    #title small { display:block; margin-top:3px; color:var(--muted); font-size:11px; font-weight:400 }
    #controls { left:16px; bottom:16px; width:290px; padding:14px }
    label { display:block; color:var(--muted); margin:9px 0 5px; font-size:12px }
    input[type=range] { width:100%; accent-color:#71a8ff }
    button, select { width:100%; background:#17243e; color:var(--text); border:1px solid #34496e; border-radius:8px; padding:8px; cursor:pointer }
    button:hover { background:#22365c } .row { display:flex; gap:7px } .row>* { flex:1 }
    #info { right:16px; top:16px; width:230px; padding:14px; min-height:110px }
    #info h3 { margin:0 0 8px; color:#8fbcff } #info p { margin:5px 0; color:var(--muted); font-size:12px }
    #hint { position:fixed; right:16px; bottom:16px; color:#71809a; font-size:11px; z-index:2; text-align:right }
    .value { float:right; color:#d8e5ff }
  </style>
</head>
<body>
<div id="app"></div>
<div id="title" class="panel">Solar System — Realistic Data Lab<small>NASA/JPL-informed visualisation · data mode</small></div>
<div id="info" class="panel"><h3>Realistic branch</h3><p>Local NASA/JPL-informed renderer. Click a body to inspect it.</p></div>
<div id="controls" class="panel">
  <div class="row"><button id="pause">Pause</button><button id="reset">Reset</button></div>
  <label>Simulation speed <span class="value" id="speedText">10 days/s</span></label>
  <input id="speed" type="range" min="0" max="100" value="50">
  <label>Camera focus</label><select id="focus"><option value="all">All bodies</option></select>
  <label><input id="trails" type="checkbox" checked> Orbit trails</label>
  <label><input id="gravity" type="checkbox" checked> N-body gravity</label>
  <label><input id="realScale" type="checkbox" checked> Physical visual scale</label>
  <div class="row"><button id="inner">Inner system</button><button id="outer">Full system</button></div>
  <button id="kuiperView">Kuiper view</button>
  <button id="jplData">Fetch JPL Earth vector</button>
  <button id="jplSystem">Fetch JPL major bodies</button>
</div>
<div id="hint">Drag: look · Wheel: zoom · Right-drag: pan · W/A/S/D + Q/E: fly</div>

function refreshSelect(){ const s=document.querySelector('#focus'); s.innerHTML='<option value="all">All bodies</option>'+bodies.map(b=>`<option value="${b.name}">${b.name}</option>`).join(''); }
function addTest(){ testCount++; makeBody(['Test planet '+testCount,1e-6,3+testCount*.8,.07,0xff66bb],Math.random()*6.28); bodies[bodies.length-1].test=true; refreshSelect(); }
function simulateLegacy(dt){if(!document.querySelector('#gravity').checked)return;const realBodies=bodies.filter(b=>!b.moon),a=realBodies.map(()=>new THREE.Vector3()),a2=realBodies.map(()=>new THREE.Vector3()),soft=.00002;for(let i=0;i<realBodies.length;i++)for(let j=i+1;j<realBodies.length;j++){const d=realBodies[j].pos.clone().sub(realBodies[i].pos),r2=Math.max(d.lengthSq(),soft),f=G*d.normalize().multiplyScalar(1/r2);a[i].addScaledVector(f,realBodies[j].mass);a[j].addScaledVector(f,-realBodies[i].mass)}realBodies.forEach((b,i)=>b.pos.addScaledVector(b.vel,dt).addScaledVector(a[i],.5*dt*dt));for(let i=0;i<realBodies.length;i++)for(let j=i+1;j<realBodies.length;j++){const d=realBodies[j].pos.clone().sub(realBodies[i].pos),r2=Math.max(d.lengthSq(),soft),f=G*d.normalize().multiplyScalar(1/r2);a2[i].addScaledVector(f,realBodies[j].mass);a2[j].addScaledVector(f,-realBodies[i].mass)}realBodies.forEach((b,i)=>{b.vel.addScaledVector(a[i].clone().add(a2[i]),.5*dt);b.mesh.position.copy(b.pos);b.label.position.copy(b.pos).add(new THREE.Vector3(0,b.mesh.geometry.parameters.radius+.16,0));if(document.querySelector('#trails').checked){b.history.push(b.pos.clone());if(b.history.length>180)b.history.shift();b.trail.geometry.setFromPoints(b.history)}});const earth=realBodies.find(b=>b.name==='Earth');bodies.filter(b=>b.moon).forEach(b=>{b.phase+=Math.sqrt(G*earthMass()/0.00257**3)*dt;const rel=new THREE.Vector3(.18*Math.cos(b.phase),.18*Math.sin(b.phase)*.0897,.18*Math.sin(b.phase)*.996);b.pos.copy(earth.pos).add(rel);b.mesh.position.copy(b.pos);b.label.position.copy(b.pos).add(new THREE.Vector3(0,.12,0))});simYears+=dt}
function earthMass(){return 3.003e-6}
// Stable reference-frame correction: keep the Sun fixed while planets interact.
function simulateNBody(dt){if(!document.querySelector('#gravity').checked)return;const bs=bodies.filter(b=>!b.moon),acc=bs.map(()=>new THREE.Vector3());for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){const d=bs[j].pos.clone().sub(bs[i].pos),r2=Math.max(d.lengthSq(),.0001),f=G*d.normalize().multiplyScalar(1/r2);acc[i].addScaledVector(f,bs[j].mass);acc[j].addScaledVector(f,-bs[i].mass)}bs.forEach((b,i)=>{if(b.name==='Sun'){b.pos.set(0,0,0);b.vel.set(0,0,0)}else{b.vel.addScaledVector(acc[i],dt);b.pos.addScaledVector(b.vel,dt);b.mesh.position.copy(b.pos);b.label.position.copy(b.pos).add(new THREE.Vector3(0,b.mesh.geometry.parameters.radius+.16,0))}if(document.querySelector('#trails').checked){b.history.push(b.pos.clone());if(b.history.length>180)b.history.shift();b.trail.geometry.setFromPoints(b.history)}});const earth=bs.find(b=>b.name==='Earth');bodies.filter(b=>b.moon).forEach(b=>{b.phase+=Math.sqrt(G*earthMass()/0.00257**3)*dt;b.pos.copy(earth.pos).add(new THREE.Vector3(.18*Math.cos(b.phase),.18*Math.sin(b.phase)*.0897,.18*Math.sin(b.phase)*.996));b.orbitRing.position.copy(earth.pos);b.mesh.position.copy(b.pos);b.label.position.copy(b.pos).add(new THREE.Vector3(0,.12,0))});simYears+=dt}
function simulate(dt){if(!document.querySelector('#gravity').checked)return;bodies.forEach(b=>{if(b.moon){const earth=bodies.find(x=>x.name==='Earth');b.phase+=13.4*dt;b.pos.copy(earth.pos).add(new THREE.Vector3(.18*Math.cos(b.phase),.18*Math.sin(b.phase)*.0897,.18*Math.sin(b.phase)*.996));b.orbitRing.position.copy(earth.pos)}else if(b.orbitRadius>0){b.phase+=Math.sqrt(G/b.orbitRadius**3)*dt;b.pos.set(b.orbitRadius*Math.cos(b.phase),0,b.orbitRadius*Math.sin(b.phase))}b.mesh.position.copy(b.pos);b.label.position.copy(b.pos).add(new THREE.Vector3(0,b.mesh.geometry.parameters.radius+.16,0));if(document.querySelector('#trails').checked){b.history.push(b.pos.clone());if(b.history.length>180)b.history.shift();b.trail.geometry.setFromPoints(b.history)}});mergeTestBodies();simYears+=dt}
function showInfo(b){selected=b; document.querySelector('#info').innerHTML=`<h3>${b.name}</h3><p>Mass: ${b.mass.toExponential(3)} solar masses</p><p>Distance from origin: ${b.pos.length().toFixed(3)} AU</p><p>Speed: ${b.vel.length().toFixed(3)} AU/year</p>`}
function applyJplEarth(text){const earth=bodies.find(b=>b.name==='Earth'),row=text.split('$$SOE')[1]?.split('$$EOE')[0]?.trim().split('\n')[0];if(!earth||!row)return;const v=row.split(',').map(x=>Number(x.trim()));if(v.length>=8&&v.slice(2,8).every(Number.isFinite)){earth.pos.set(v[2],v[3],v[4]);earth.vel.set(v[5]*365.25,v[6]*365.25,v[7]*365.25);earth.jplLocked=true;earth.mesh.position.copy(earth.pos);earth.label.position.copy(earth.pos).add(new THREE.Vector3(0,.25,0))}}
async function fetchJplSystem(){const ids={Mercury:'199',Venus:'299',Earth:'399',Mars:'499',Jupiter:'599',Saturn:'699',Uranus:'799',Neptune:'899',Pluto:'999'};for(const [name,id] of Object.entries(ids)){try{const text=await (await fetch('/api/jpl-body?target='+id)).text();const body=bodies.find(b=>b.name===name),row=text.split('$$SOE')[1]?.split('$$EOE')[0]?.trim().split('\n')[0],v=row?.split(',').map(x=>Number(x.trim()));if(body&&v?.length>=8&&v.slice(2,8).every(Number.isFinite)){body.pos.set(v[2],v[3],v[4]);body.vel.set(v[5]*365.25,v[6]*365.25,v[7]*365.25);body.jplLocked=true;body.mesh.position.copy(body.pos)}}catch(e){console.warn('JPL '+name,e)}}}
function mergeTestBodies(){for(let i=bodies.length-1;i>=0;i--)for(let j=i-1;j>=0;j--){const a=bodies[i],b=bodies[j];if(a.test&&b.test&&a.pos.distanceTo(b.pos)<.12){b.mass+=a.mass;b.mesh.scale.multiplyScalar(1.12);scene.remove(a.mesh);scene.remove(a.label);scene.remove(a.trail);bodies.splice(i,1);refreshSelect();break}}}
renderer.domElement.addEventListener('click',e=>{const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(bodies.map(b=>b.mesh))[0];if(hit)showInfo(bodies.find(b=>b.mesh===hit.object))});
const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true}); addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function wideView(){camera.position.set(0,20,32);controls.target.set(0,0,0);controls.update()}
addEventListener('keydown',e=>{if(e.key==='Home')wideView()});
document.querySelector('#pause').onclick=()=>{running=!running;document.querySelector('#pause').textContent=running?'Pause':'Play'}; document.querySelector('#reset').onclick=reset;
document.querySelector('#speed').oninput=e=>document.querySelector('#speedText').textContent=(+e.target.value/5).toFixed(1)+' days/s'; document.querySelector('#focus').onchange=e=>{const b=bodies.find(x=>x.name===e.target.value);if(b){controls.target.copy(b.pos);const d=Math.max(1.2,b.mesh.geometry.parameters.radius*7);camera.position.copy(b.pos).add(new THREE.Vector3(d*.45,d*.35,d));}else{controls.target.set(0,0,0);camera.position.set(0,20,32)}};
document.querySelector("#realScale").onchange=e=>{realisticMode=e.target.checked;reset()};
document.querySelector('#inner').onclick=()=>{camera.position.set(0,4,6);controls.target.set(0,0,0)}; document.querySelector('#outer').onclick=wideView; document.querySelector('#kuiperView').onclick=()=>{camera.position.set(0,48,78);controls.target.set(0,0,0)};
document.querySelector('#jplData').onclick=async()=>{const info=document.querySelector('#info');info.innerHTML='<h3>Loading JPL data…</h3><p>Requesting Earth state vector.</p>';try{const u='/api/jpl-body?target=399';const t=await (await fetch(u)).text();applyJplEarth(t);const row=t.split('$$SOE')[1]?.split('$$EOE')[0]?.trim().split('\n')[0]||'';info.innerHTML='<h3>JPL Earth vector</h3><p>Live Horizons response received.</p><p class="muted">'+row.slice(0,180)+'</p>'}catch(e){info.innerHTML='<h3>JPL request failed</h3><p>'+e.message+'</p>'}};
document.querySelector('#jplSystem').onclick=async()=>{document.querySelector('#info').innerHTML='<h3>Loading JPL system…</h3><p>Fetching major-body vectors.</p>';await fetchJplSystem();document.querySelector('#info').innerHTML='<h3>JPL system loaded</h3><p>Major planetary state vectors applied.</p>'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}); try{reset()}catch(err){console.error(err);document.querySelector('#info').innerHTML='<h3>Startup error</h3><p>'+err.message+'</p>'}
let last=performance.now(); function loop(now){requestAnimationFrame(loop);const real=Math.min((now-last)/1000,.1);last=now;asteroidBelt.rotation.y=simYears*1.5;trojans.rotation.y=simYears*1.15;centaurs.rotation.y=simYears*.42;kuiperBelt.rotation.y=simYears*.025;if(running){cometPhase+=real*.18;flareClock+=real;}solarPlasma.forEach((f,i)=>{const active=i===Math.floor(flareClock/5)%solarPlasma.length&&flareClock%5<1.4;const pulse=active?Math.sin((flareClock%5)/1.4*Math.PI):0;f.mesh.visible=active;f.mesh.scale.setScalar(.45+.55*pulse);f.mesh.material.opacity=.15+.55*pulse;f.mesh.rotation.z+=real*f.rate*(running?1:0)});const ce=.86,a=18,b=a*Math.sqrt(1-ce*ce),x=a*(Math.cos(cometPhase)-ce),z=b*Math.sin(cometPhase);comet.position.set(x,0,z);cometTrail.push(comet.position.clone());if(cometTrail.length>90)cometTrail.shift();cometTail.geometry.setFromPoints(cometTrail);cometLabel.position.copy(comet.position).add(new THREE.Vector3(0,.2,0));const fly=real*8;const dir=new THREE.Vector3();camera.getWorldDirection(dir);const side=new THREE.Vector3().crossVectors(dir,camera.up).normalize();const up=camera.up.clone().normalize();if(keys.w){camera.position.addScaledVector(dir,fly);controls.target.addScaledVector(dir,fly)}if(keys.s){camera.position.addScaledVector(dir,-fly);controls.target.addScaledVector(dir,-fly)}if(keys.a){camera.position.addScaledVector(side,-fly);controls.target.addScaledVector(side,-fly)}if(keys.d){camera.position.addScaledVector(side,fly);controls.target.addScaledVector(side,fly)}if(keys.q){camera.position.addScaledVector(up,-fly);controls.target.addScaledVector(up,-fly)}if(keys.e){camera.position.addScaledVector(up,fly);controls.target.addScaledVector(up,fly)}satellites.forEach(s=>{const a=s.l2?Math.PI+simYears*.04:s.phase+simYears*13;const r=s.radius;s.group.position.copy(s.earth.pos).add(new THREE.Vector3(r*Math.cos(a),s.l2?0.0:r*.25,r*Math.sin(a)));s.label.position.copy(s.group.position).add(new THREE.Vector3(0,.08,0))});if(running){const total=real*(+document.querySelector('#speed').value/5)/365.25;const steps=Math.max(1,Math.ceil(total/.0001));for(let i=0;i<steps;i++)simulate(total/steps);bodies.forEach(b=>{const p=spinDays[b.name];if(p)b.mesh.rotation.y+=Math.PI*2*(real*(+document.querySelector("#speed").value/5))/p})}controls.update();renderer.render(scene,camera)} requestAnimationFrame(loop);
</script></body></html>
